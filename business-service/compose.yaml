services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: classroom_face_checkin
      MYSQL_USER: classroom
      MYSQL_PASSWORD: change-me
      MYSQL_ROOT_PASSWORD: local-root-only
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-plocal-root-only"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  recognition-service:
    build:
      context: ..
      dockerfile: recognition_service/Dockerfile
    environment:
      RECOGNITION_SHARED_TOKEN: ${RECOGNITION_SHARED_TOKEN:?Set RECOGNITION_SHARED_TOKEN before starting services}
      RECOGNITION_FACEBANK_ROOT: /var/lib/recognition/facebanks
    expose:
      - "8090"
    volumes:
      - recognition-facebanks:/var/lib/recognition

  business-service:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DB_URL: jdbc:mysql://mysql:3306/classroom_face_checkin?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
      DB_USERNAME: classroom
      DB_PASSWORD: change-me
      REDIS_HOST: redis
      RECOGNITION_ENABLED: "true"
      RECOGNITION_BASE_URL: http://recognition-service:8090
      RECOGNITION_SHARED_TOKEN: ${RECOGNITION_SHARED_TOKEN:?Set RECOGNITION_SHARED_TOKEN before starting services}
    ports:
      - "8081:8081"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      recognition-service:
        condition: service_started

volumes:
  mysql-data:
  redis-data:
  recognition-facebanks:
