spring:
  application:
    name: classroom-face-checkin-business-service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/classroom_face_checkin?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
    username: ${DB_USERNAME:classroom}
    password: ${DB_PASSWORD:change-me}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful
  max-http-request-header-size: 16KB

recognition:
  enabled: ${RECOGNITION_ENABLED:false}
  base-url: ${RECOGNITION_BASE_URL:http://localhost:8090}
  shared-token: ${RECOGNITION_SHARED_TOKEN:}
  connect-timeout-ms: ${RECOGNITION_CONNECT_TIMEOUT_MS:1000}
  read-timeout-ms: ${RECOGNITION_READ_TIMEOUT_MS:5000}

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
